<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf6f8"/><stop offset="1" stop-color="#f7eddf"/></linearGradient>
  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#563d2f" flood-opacity=".16"/></filter>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f7182"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a13c24"/></marker>
</defs>
<rect width="1400" height="760" fill="url(#bg)"/>
<text x="90" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#281b16">Habibi's Morocco · ruta 26 SEP → 4 OCT</text>
<text x="90" y="132" font-family="Arial,sans-serif" font-size="20" fill="#756055">Vuelo Barcelona ↔ Tánger + recorrido por carretera en Marruecos</text>

<!-- flight -->
<path d="M180 240 C390 80, 570 85, 720 250" fill="none" stroke="#2f7182" stroke-width="7" stroke-dasharray="15 12" marker-end="url(#arrowBlue)"/>
<path d="M720 288 C540 420, 350 420, 180 275" fill="none" stroke="#2f7182" stroke-width="4" stroke-dasharray="10 10" opacity=".75" marker-end="url(#arrowBlue)"/>
<text x="400" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2f7182">✈ 26/09 · BCN 15:45 → TNG 15:45</text>
<text x="350" y="405" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2f7182">✈ 04/10 · TNG 06:40 → BCN 10:30</text>

