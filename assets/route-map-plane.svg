<g filter="url(#s)" font-family="Arial,sans-serif">
  <g transform="translate(110 205)"><circle r="26" fill="#2f7182"/><text x="0" y="8" text-anchor="middle" font-size="24" fill="white">✈</text><text x="0" y="58" text-anchor="middle" font-size="23" font-weight="700" fill="#281b16">Barcelona T2</text><text x="0" y="84" text-anchor="middle" font-size="16" fill="#756055">Parking AENA</text></g>
  <g transform="translate(745 250)"><circle r="28" fill="#a13c24"/><text x="0" y="8" text-anchor="middle" font-size="22" fill="white">1</text><text x="0" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#281b16">Tánger</text></g>
  <g transform="translate(1040 190)"><circle r="25" fill="#a13c24"/><text x="0" y="8" text-anchor="middle" font-size="20" fill="white">2</text><text x="0" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#281b16">Chefchaouen</text></g>
  <g transform="translate(1190 260)"><circle r="22" fill="#a13c24"/><text x="0" y="7" text-anchor="middle" font-size="18" fill="white">3</text><text x="0" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#281b16">Tetuán / Fnideq</text></g>
  <g transform="translate(835 430)"><circle r="25" fill="#a13c24"/><text x="0" y="8" text-anchor="middle" font-size="20" fill="white">4</text><text x="0" y="55" text-anchor="middle" font-size="21" font-weight="700" fill="#281b16">Rabat</text></g>
  <g transform="translate(920 625)"><circle r="29" fill="#a13c24"/><text x="0" y="9" text-anchor="middle" font-size="22" fill="white">5</text><text x="0" y="62" text-anchor="middle" font-size="23" font-weight="700" fill="#281b16">Marrakech</text><text x="0" y="88" text-anchor="middle" font-size="16" fill="#756055">Agafay · Chez Ali</text></g>
  <g transform="translate(690 475)"><circle r="23" fill="#2f7182"/><text x="0" y="8" text-anchor="middle" font-size="18" fill="white">6</text><text x="0" y="53" text-anchor="middle" font-size="20" font-weight="700" fill="#281b16">Asilah</text></g>
</g>

<!-- road route -->
