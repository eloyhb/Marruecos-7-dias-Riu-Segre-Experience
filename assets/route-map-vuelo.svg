<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-label="Esquema de vuelo Barcelona-Tánger y ruta por Marruecos">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8422a"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2764a8"/></marker>
    <style>.bg{fill:#f5efe4}.sea{fill:#dfeef5}.land{fill:#efe4ce}.city{fill:#173b31}.label{font:700 25px Arial,sans-serif;fill:#173b31}.small{font:600 18px Arial,sans-serif;fill:#53635c}.route{fill:none;stroke:#b8422a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.back{fill:none;stroke:#2764a8;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowb)}.flight{fill:none;stroke:#4d6f89;stroke-width:5;stroke-dasharray:14 12}.dot{fill:#fff;stroke:#173b31;stroke-width:5}</style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="28"/>
  <path class="sea" d="M0 0h1200v650H0z"/>
  <path class="land" d="M0 0h1200v160H0zM80 290c170-90 380-85 560-30 170 52 300 46 480 5l80 385H0z"/>
