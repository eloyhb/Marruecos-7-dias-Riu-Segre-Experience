<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Vuelo Barcelona-Tánger y ruta por Marruecos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f0e3"/><stop offset="1" stop-color="#efe0ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6a4633" flood-opacity=".18"/></filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2f7182"/></marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a13c24"/></marker>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <text x="56" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#281b16">Habibis 2026 · avión + coche</text>
  <text x="56" y="88" font-family="Arial,sans-serif" font-size="16" fill="#756055">26 septiembre → 3 octubre · 4 viajeros</text>

  <!-- flight -->
  <g filter="url(#shadow)">
    <rect x="70" y="130" width="260" height="100" rx="20" fill="#fffdf8" stroke="#e3d5c5"/>
    <text x="95" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#281b16">Barcelona · BCN</text>
    <text x="95" y="200" font-family="Arial,sans-serif" font-size="17" fill="#756055">26/09 · 15:45</text>
    <rect x="870" y="130" width="260" height="100" rx="20" fill="#fffdf8" stroke="#e3d5c5"/>
    <text x="895" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#281b16">Tánger · TNG</text>
    <text x="895" y="200" font-family="Arial,sans-serif" font-size="17" fill="#756055">26/09 · 15:45</text>
  </g>
  <path d="M340 180 C520 70, 680 70, 860 180" fill="none" stroke="#2f7182" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrowBlue)"/>
  <text x="560" y="105" font-family="Arial,sans-serif" font-size="28">✈</text>

  <!-- Morocco route -->
  <path d="M1000 250 C990 300,930 330,880 350 C770 390,675 410,610 470 C540 530,430 510,350 465" fill="none" stroke="#a13c24" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <path d="M350 465 C500 540,720 535,920 430 C980 398,1005 340,1000 250" fill="none" stroke="#2f7182" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrowBlue)"/>

  <g font-family="Arial,sans-serif">
    <g transform="translate(1000 250)"><circle r="11" fill="#a13c24"/><text x="18" y="6" font-size="18" font-weight="700" fill="#281b16">Tánger</text></g>
    <g transform="translate(885 338)"><circle r="9" fill="#a13c24"/><text x="16" y="6" font-size="16" fill="#281b16">Chefchaouen</text></g>
    <g transform="translate(800 370)"><circle r="9" fill="#a13c24"/><text x="16" y="6" font-size="16" fill="#281b16">Tetuán / Fnideq</text></g>
    <g transform="translate(650 432)"><circle r="9" fill="#a13c24"/><text x="16" y="6" font-size="16" fill="#281b16">Rabat</text></g>
    <g transform="translate(350 465)"><circle r="11" fill="#a13c24"/><text x="18" y="6" font-size="18" font-weight="700" fill="#281b16">Marrakech / Agafay</text></g>
    <g transform="translate(760 500)"><circle r="9" fill="#2f7182"/><text x="16" y="6" font-size="16" fill="#281b16">Asilah</text></g>
  </g>

  <g transform="translate(70 545)" font-family="Arial,sans-serif" font-size="15" fill="#5c4a40">
    <circle cx="8" cy="0" r="6" fill="#a13c24"/><text x="22" y="5">ida por carretera</text>
    <circle cx="190" cy="0" r="6" fill="#2f7182"/><text x="204" y="5">regreso por Asilah</text>
    <text x="430" y="5">Vuelta aérea: TNG 03/10 · 06:40 → BCN 10:30</text>
  </g>
</svg>
