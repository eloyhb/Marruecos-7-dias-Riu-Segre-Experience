  <circle class="dot" cx="565" cy="590" r="10"/><text x="595" y="600" class="small">Marrakech</text>
  <circle class="dot" cx="505" cy="300" r="10"/><text x="395" y="286" class="small">Asilah</text>
  <path class="route" d="M550 325 L420 405 L455 355 L550 325 L380 490 L565 590"/>
