  <text x="50" y="345" class="label">Marruecos</text>
  <circle class="dot" cx="760" cy="105" r="12"/><text x="782" y="113" class="label">Barcelona</text>
  <circle class="dot" cx="550" cy="325" r="12"/><text x="575" y="333" class="label">Tánger</text>
  <path class="flight" d="M755 120 C720 200 640 255 565 315"/>
